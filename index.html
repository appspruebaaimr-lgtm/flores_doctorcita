<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti 🌻</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;

            background:
                radial-gradient(circle at center, #332600 0%, #120f05 45%, #050505 100%);

            font-family: Georgia, serif;
            color: white;
        }

        .contenedor {
            position: relative;
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            z-index: 5;
        }

        h1 {
            font-size: clamp(35px, 9vw, 70px);
            color: #ffd83d;

            text-shadow:
                0 0 10px #ffcc00,
                0 0 25px #ffb300,
                0 0 50px #ff8c00;

            animation: aparecer 2s ease forwards;
        }

        p {
            margin-top: 20px;

            max-width: 80%;
            font-size: clamp(18px, 4vw, 27px);

            color: #fff4bd;

            animation: aparecer 3s ease forwards;
        }

        .flor {
            position: absolute;

            font-size: 70px;

            filter:
                drop-shadow(0 0 10px #ffd000)
                drop-shadow(0 0 25px #ffae00);

            animation:
                aparecerFlor 2s ease forwards,
                flotar 5s ease-in-out infinite;
        }

        .f1 {
            left: 8%;
            bottom: 10%;
            animation-delay: .2s;
        }

        .f2 {
            left: 25%;
            top: 12%;
            font-size: 50px;
            animation-delay: .6s;
        }

        .f3 {
            right: 8%;
            bottom: 15%;
            font-size: 85px;
            animation-delay: 1s;
        }

        .f4 {
            right: 22%;
            top: 10%;
            font-size: 55px;
            animation-delay: 1.4s;
        }

        .f5 {
            left: 45%;
            bottom: 5%;
            font-size: 45px;
            animation-delay: 1.8s;
        }

        .petalo {
            position: absolute;
            top: -50px;

            font-size: 25px;

            animation: caer linear infinite;

            opacity: .8;
        }

        .p1 {
            left: 10%;
            animation-duration: 7s;
        }

        .p2 {
            left: 30%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .p3 {
            left: 55%;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .p4 {
            left: 80%;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes aparecerFlor {
            from {
                opacity: 0;
                transform: scale(0);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes flotar {
            0%, 100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-15px) rotate(3deg);
            }
        }

        @keyframes caer {
            0% {
                transform:
                    translateY(-50px)
                    rotate(0deg);
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Flores principales -->

    <div class="flor f1">🌻</div>
    <div class="flor f2">🌼</div>
    <div class="flor f3">🌻</div>
    <div class="flor f4">🌼</div>
    <div class="flor f5">🌻</div>


    <!-- Pétalos cayendo -->

    <div class="petalo p1">🌼</div>
    <div class="petalo p2">🌻</div>
    <div class="petalo p3">🌼</div>
    <div class="petalo p4">🌻</div>


    <!-- Mensaje -->

    <div class="contenedor">

        <h1>Para ti 🌻</h1>

        <p>
            Porque algunas cosas bonitas
            simplemente merecen ser compartidas.
        </p>

    </div>

</body>
</html>
